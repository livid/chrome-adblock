<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" width="28" height="28" alt="">
    <h1>Shield</h1>
  </header>

  <section class="site">
    <div class="site-info">
      <div id="host" class="host">–</div>
      <div id="status" class="status"></div>
    </div>
    <label class="switch big" title="Block ads on this site">
      <input type="checkbox" id="siteToggle">
      <span></span>
    </label>
  </section>

  <section class="count">
    <span id="count">0</span>
    <small>requests blocked on this page</small>
  </section>

  <section class="settings">
    <label class="row">
      <span>Block ads &amp; trackers</span>
      <span class="switch"><input type="checkbox" data-setting="ads"><span></span></span>
    </label>
    <label class="row">
      <span>Block malware, phishing &amp; miners</span>
      <span class="switch"><input type="checkbox" data-setting="threats"><span></span></span>
    </label>
    <label class="row">
      <span>Hide ad elements on pages</span>
      <span class="switch"><input type="checkbox" data-setting="cosmetic"><span></span></span>
    </label>
    <label class="row">
      <span>Strip tracking codes from links</span>
      <span class="switch"><input type="checkbox" data-setting="cleanUrls"><span></span></span>
    </label>
  </section>

  <footer>
    <div id="lists" class="lists"></div>
    <button id="update" type="button">Update lists</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
